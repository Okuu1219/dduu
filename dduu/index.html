<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 AI 聊天</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #f0f2f5; height: 100vh; display: flex;
      justify-content: center; align-items: center;
    }
    .chat-container {
      width: 100%; max-width: 720px; height: 90vh; background: #ffffff;
      border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header {
      padding: 16px 20px; background: linear-gradient(135deg, #4f7cff, #6b5bff);
      color: #fff; text-align: center;
    }
    .chat-header h1 { font-size: 18px; font-weight: 600; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .message { display: flex; width: 100%; }
    .message.user { justify-content: flex-end; }
    .message.ai { justify-content: flex-start; }
    .bubble {
      max-width: 75%; padding: 10px 14px; border-radius: 14px;
      font-size: 15px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap;
    }
    .message.user .bubble {
      background: #4f7cff; color: #fff; border-bottom-right-radius: 4px;
    }
    .message.ai .bubble {
      background: #f1f3f5; color: #1a1a1a; border-bottom-left-radius: 4px;
    }
    .chat-input-area {
      display: flex; gap: 10px; padding: 14px 16px;
      border-top: 1px solid #eee; background: #fafafa; align-items: flex-end;
    }
    .message-input {
      flex: 1; resize: none; border: 1px solid #ddd; border-radius: 12px;
      padding: 10px 14px; font-size: 15px; font-family: inherit;
      outline: none; max-height: 120px; line-height: 1.5; transition: border-color 0.2s;
    }
    .message-input:focus { border-color: #4f7cff; }
    .send-button {
      padding: 10px 22px; background: #4f7cff; color: #fff; border: none;
      border-radius: 12px; font-size: 15px; cursor: pointer; transition: background 0.2s;
    }
    .send-button:hover { background: #3a63e0; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;">
      <div style="width: 24px;"></div>
      <h1 style="margin: 0; font-size: 18px;">🤖 我的 AI 助手</h1>
      <button id="settingsBtn" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">⚙️</button>
    </header>
    <div id="settingsModal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;">
      <div style="background: white; padding: 20px; border-radius: 12px; width: 80%; max-width: 400px;">
        <h3 style="margin-top: 0; color: #333;">系统提示词 (Prompt)</h3>
        <textarea id="promptInput" rows="6" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; resize: none; outline: none; margin-bottom: 15px;" placeholder="在这里输入你想让 AI 遵守的规则..."></textarea>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button id="closeModalBtn" style="padding: 8px 16px; border: none; border-radius: 8px; background: #eee; cursor: pointer;">取消</button>
          <button id="savePromptBtn" style="padding: 8px 16px; border: none; border-radius: 8px; background: #4f7cff; color: white; cursor: pointer;">保存</button>
        </div>
      </div>
    </div>
    <main class="chat-messages" id="chatMessages">
      <div class="message ai">
        <div class="bubble">你好！我是你的 AI 助手，有什么可以帮你的吗？</div>
      </div>
    </main>
    <footer class="chat-input-area">
      <textarea id="messageInput" class="message-input" placeholder="输入消息..." rows="1"></textarea>
      <button id="sendButton" class="send-button">发送</button>
    </footer>
  </div>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('PWA 服务注册成功！');
          })
          .catch(err => {
            console.log('PWA 服务注册失败:', err);
          });
      });
    }
  </script>
</body>
</html>
