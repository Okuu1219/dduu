<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>uu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;">
      <div style="width: 24px;"></div>
      <h1 style="margin: 0; font-size: 18px;">🤖 我的 AI 助手</h1>
      <button id="settingsBtn" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">⚙️</button>
    </header>
    <div id="settingsModal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;">
      <div style="background: white; padding: 20px; border-radius: 12px; width: 80%; max-width: 400px;">
        <h3 style="margin-top: 0; color: #333;">系统提示词 (Prompt)</h3>
        <textarea id="promptInput" rows="6" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; resize: none; outline: none; margin-bottom: 15px;" placeholder="在这里输入你想让 AI 遵守的规则..."></textarea>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button id="closeModalBtn" style="padding: 8px 16px; border: none; border-radius: 8px; background: #eee; cursor: pointer;">取消</button>
          <button id="savePromptBtn" style="padding: 8px 16px; border: none; border-radius: 8px; background: #4f7cff; color: white; cursor: pointer;">保存</button>
        </div>
      </div>
    </div>
    <main class="chat-messages" id="chatMessages">
      <div class="message ai">
        <div class="bubble">你好！我是你的 AI 助手，有什么可以帮你的吗？</div>
      </div>
    </main>
    <footer class="chat-input-area">
      <textarea id="messageInput" class="message-input" placeholder="输入消息..." rows="1"></textarea>
      <button id="sendButton" class="send-button">发送</button>
    </footer>
  </div>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('PWA 服务注册成功！');
          })
          .catch(err => {
            console.log('PWA 服务注册失败:', err);
          });
      });
    }
  </script>
</body>
</html>
